<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title data-i18n="titleHome">Night Orders</title>
  <meta name="description" data-i18n-content="descHome" content="The record stays with you. Alison and Pack Run." />
  <link rel="canonical" href="https://nightorders.app/" />
  <meta property="og:title" data-i18n-content="titleHome" content="Night Orders" />
  <meta property="og:description" data-i18n-content="descMotto" content="The record stays with you." />
  <meta property="og:url" content="https://nightorders.app/" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" href="favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <script src="locale.js"></script>
  <link rel="stylesheet" href="site-1836.css?v=power5" />
  <style>
    body.power { --bloom-b: rgba(64, 168, 196, 0.28); --chroma-b: rgba(64, 168, 196, 0.22); }
    body.power main { max-width: min(74rem, calc(100% - 1.2rem)); }
    body.power .pair.stage { display: grid; gap: 1.4rem; align-items: stretch; }
    @media (min-width: 64rem) {
      body.power .pair.stage { grid-template-columns: 1fr 1fr; gap: 2rem; }
    }
    body.power .phone.play {
      --w: min(26rem, 92vw);
      width: var(--w);
      max-width: 100%;
      height: min(42rem, calc(100dvh - var(--chrome-stack)));
      min-height: 28rem;
      max-height: calc(100dvh - var(--chrome-stack));
    }
  </style>
</head>
<body class="power">
  <header class="mast">
    <p class="mark">Night Orders</p>
    <nav class="mast-nav" data-i18n-aria="navAria" aria-label="Site">
      <a href="index.html">Night Orders</a>
      <a href="alison.html">Alison</a>
      <a href="pack-run.html">Pack Run</a>
      <a href="support.html" data-i18n="navSupport">Support</a>
    </nav>
  </header>
  <main>
    <p class="motto" data-i18n="motto">The record stays with you.</p>

    <section class="pair stage">
      <article class="app-block">
        <figure class="phone-wrap">
          <div class="phone alison-phone play" data-rooms="alison" role="region" data-i18n-aria="alisonRoomsAria" aria-label="Alison. Opening, Home, Food, Journal, Clinic, Yours.">
          <div class="phone-inner">
            <div class="chrome"><span class="clock">9:41</span><span class="island" aria-hidden="true"></span></div>
            <div class="screen rooms-screen">
              <div class="room is-on opening" data-room="opening">
                <p class="app-name">Alison</p>
                <p class="whisper" data-i18n="alisonOpeningLine">The journal is yours. Not a diagnosis.</p>
                <p class="no-ads" data-i18n="alisonNoAds">No ads forever</p>
                <p class="whisper privacy-line" data-i18n="alisonPrivacyLine">Journal stays on this phone. Location is optional, weather only. Apple Health is optional: journal overlay, not diagnosis. Not a medical device.</p>
                <a class="privacy-link" href="privacy-alison.html" data-i18n="alisonPrivacyPolicy">Privacy policy</a>
                <button type="button" class="open-btn" data-alison-open data-i18n="alisonOpen">OPEN</button>
              </div>
              <div class="room" data-room="home" hidden>
                <p class="app-name" data-i18n="alisonTabHome">Home</p>
                <p class="whisper" data-i18n="alisonHomeWhisper">Start when it begins. Stop when it ends.</p>
                <div class="sheet">
                  <p class="room-title" data-i18n="alisonHeadacheNow">Headache right now?</p>
                  <p class="whisper" data-i18n="alisonHugeStart">Huge Start. Someone else can tap it. Details fill later.</p>
                  <p class="whisper" data-alison-live hidden></p>
                  <button type="button" class="start start-now" data-alison-start data-i18n="alisonStart">Start</button>
                  <button type="button" class="leave" data-alison-stop hidden data-i18n="alisonStop">Stop</button>
                </div>
              </div>
              <div class="room" data-room="food" hidden>
                <p class="app-name" data-i18n="alisonTabFood">Food</p>
                <p class="whisper" data-i18n="alisonFoodHelp">Ingredients are the help.</p>
                <div class="add-row">
                  <input type="text" data-alison-food-input autocomplete="off" enterkeyhint="done" maxlength="80" placeholder="Type a food" aria-label="Type a food" />
                  <button type="button" data-alison-food-add data-i18n="alisonAdd">Add</button>
                </div>
                <ul class="log" data-alison-food-log></ul>
              </div>
              <div class="room" data-room="journal" hidden>
                <p class="app-name" data-i18n="alisonTabJournal">Journal</p>
                <p class="whisper" data-i18n="alisonJournalWhisper">Journal is nothing extra. It is what you already wrote.</p>
                <p class="whisper" data-alison-journal-empty data-i18n="alisonJournalEmpty">Nothing yet. Start, then Stop. Meals on Food.</p>
                <ul class="log" data-alison-journal></ul>
              </div>
              <div class="room" data-room="clinic" hidden>
                <p class="app-name" data-i18n="alisonTabClinic">Clinic</p>
                <p class="whisper" data-alison-clinic-lock data-i18n="alisonClinicWhisper">Clinic letter stays closed until the count is honest. You can still share the month page. Not a diagnosis.</p>
                <p class="whisper" data-alison-clinic-count></p>
                <p class="whisper" data-i18n="alisonClinicNote">Five episodes, eight meals, seven days. Your words. Not a medical device.</p>
                <button type="button" class="leave" data-alison-share data-i18n="alisonShareMonth">Share month</button>
                <p class="whisper" data-alison-share-ack hidden></p>
              </div>
              <div class="room" data-room="yours" hidden>
                <p class="app-name" data-i18n="alisonTabYours">Yours</p>
                <p class="whisper" data-i18n="alisonYoursWhisper">Data is beautiful. It is yours.</p>
                <div class="sheet">
                  <p class="room-title" data-i18n="alisonHealthPipe">Apple Health</p>
                  <p class="health-ack" data-alison-health-ack data-i18n="alisonHealthStillOff">Still off</p>
                  <p class="whisper" data-alison-health-truth data-i18n="alisonHealthTruth">Optional. This browser cannot read Apple Health. Journal still works.</p>
                  <button type="button" class="leave" data-alison-health data-i18n="alisonHealthConnect">Connect</button>
                </div>
                <p class="whisper" data-i18n="alisonKeepP">Journal readable without Keep. Keep is a 30-day free trial, then $0.99/month through Apple for new Start, Food, and Health pull. When the trial or Keep ends, those services end. Restore on the Keep screen. Cancel in Apple Subscriptions.</p>
              </div>
            </div>
            <nav class="glass-bar alison-tabbar" hidden role="tablist" data-i18n-aria="alisonTabAria" aria-label="Alison">
              <button type="button" class="nav-tab" role="tab" data-tab="home" aria-selected="false" data-i18n="alisonTabHome">Home</button>
              <button type="button" class="nav-tab" role="tab" data-tab="food" aria-selected="false" data-i18n="alisonTabFood">Food</button>
              <button type="button" class="nav-tab" role="tab" data-tab="journal" aria-selected="false" data-i18n="alisonTabJournal">Journal</button>
              <button type="button" class="nav-tab" role="tab" data-tab="clinic" aria-selected="false" data-i18n="alisonTabClinic">Clinic</button>
              <button type="button" class="nav-tab" role="tab" data-tab="yours" aria-selected="false" data-i18n="alisonTabYours">Yours</button>
            </nav>
          </div>
        </div>
        </figure>
      </article>

      <article class="app-block">
        <figure class="phone-wrap">
          <div class="phone pack play" data-rooms="pack" role="region" data-i18n-aria="packRoomsAria" aria-label="Pack Run. Opening, dogs, parks, Keep.">
          <div class="phone-inner">
            <div class="chrome"><span class="clock">9:41</span><span class="island" aria-hidden="true"></span></div>
            <div class="screen rooms-screen">
              <div class="room is-on opening" data-room="opening">
                <p class="whisper">Pack Run</p>
                <p class="app-name" data-i18n="packTagline">One park. One count.</p>
                <p class="whisper" data-i18n="packOpeningLine">Check-in lasts 90 minutes, then it's gone. Still here? Check in again. The count is this park, this pack. If the board is quiet, it's just this phone. Location is only to find nearby parks.</p>
                <p class="no-ads" data-i18n="packNoAds">No ads forever</p>
                <a class="privacy-link" href="privacy-pack-run.html" data-i18n="packPrivacyPolicy">Privacy policy</a>
                <button type="button" class="open-btn pack-open-btn" data-pack-open data-i18n="packOpen">OPEN</button>
              </div>
              <div class="room" data-room="parks" hidden>
                <p class="app-name" data-i18n="packTabParks">Parks</p>
                <p class="whisper" data-i18n="packNearby">Nearby parks. Counts, no names.</p>
                <button type="button" class="park-btn" data-pack-park="named" data-pack-to-checkin>
                  <span data-i18n="packNamedPark">Named park</span>
                  <span class="qty" data-pack-count="named">0</span>
                </button>
                <button type="button" class="park-btn" data-pack-park="hill" data-pack-to-checkin>
                  <span data-i18n="packHillPark">Hill park</span>
                  <span class="qty" data-pack-count="hill">0</span>
                </button>
                <p class="whisper" data-i18n="packThisPhone">This phone only.</p>
              </div>
              <div class="room" data-room="checkin" hidden>
                <button type="button" class="back" data-pack-to-parks data-i18n="packBack">Parks</button>
                <p class="app-name" data-pack-park-title data-i18n="packNamedPark">Named park</p>
                <p class="whisper" data-i18n="packNoNames">No names on the park board.</p>
                <p class="count-num" data-pack-detail-count>0</p>
                <button type="button" class="check" data-pack-checkin data-i18n="packCheckIn">Check in</button>
                <button type="button" class="leave" data-pack-leave hidden data-i18n="packLeave">Leave</button>
                <p class="erase" data-pack-ttl data-i18n="packErase">Erases in 90 minutes.</p>
                <p class="whisper" data-i18n="packNoPhoto">No photo. No GPS track.</p>
              </div>
              <div class="room" data-room="dogs" hidden>
                <p class="app-name" data-i18n="packTabDogs">Dogs</p>
                <p class="whisper" data-i18n="packDogsWhisper">Your dogs. On this phone. No names on the park board.</p>
                <div class="add-row">
                  <input type="text" data-pack-dog-input autocomplete="off" enterkeyhint="done" maxlength="40" placeholder="Dog name" aria-label="Dog name" />
                  <button type="button" data-pack-dog-add data-i18n="packAddDog">Add</button>
                </div>
                <ul class="log" data-pack-dog-log></ul>
              </div>
              <div class="room" data-room="keep" hidden>
                <p class="app-name" data-i18n="packTabKeep">Keep</p>
                <p class="whisper" data-i18n="packKeepTrial">30-day free trial, then $0.99 / month through Apple.</p>
                <p class="whisper" data-i18n="packKeepPaid">Not a paid download.</p>
                <p class="whisper" data-i18n="packKeepRoom">The live count stays. Check-in waits on Keep. When the trial or Keep ends, check-in ends with it.</p>
                <p class="whisper" data-i18n="packKeepMute">No ads. Auto-renews. Cancel in Apple Subscriptions.</p>
              </div>
            </div>
            <nav class="glass-bar pack-tabbar" hidden role="tablist" data-i18n-aria="packTabAria" aria-label="Pack Run">
              <button type="button" class="nav-tab" role="tab" data-tab="parks" aria-selected="false" data-i18n="packTabParks">Parks</button>
              <button type="button" class="nav-tab" role="tab" data-tab="dogs" aria-selected="false" data-i18n="packTabDogs">Dogs</button>
              <button type="button" class="nav-tab" role="tab" data-tab="keep" aria-selected="false" data-i18n="packTabKeep">Keep</button>
            </nav>
          </div>
        </div>
        </figure>
      </article>
    </section>

  </main>
  <footer class="foot">
    <div class="foot-links">
      <a href="alison.html">Alison</a>
      <a href="pack-run.html">Pack Run</a>
      <a href="support.html" data-i18n="navSupport">Support</a>
      <a href="faq.html" data-i18n="navFaq">FAQ</a>
      <a href="privacy.html" data-i18n="navPrivacy">Privacy</a>
      <a href="legal.html" data-i18n="navLegal">Legal</a>
    </div>
    <p class="coming" data-i18n="coming">Coming to the App Store</p>
    <p data-i18n="footLine">Night Orders. No ads. No account.</p>
    <p><span data-i18n="supportPrefix">Support:</span> <!--email_off--><a class="mail" href="mailto:support@nightorders.app">support@nightorders.app</a><!--/email_off-->.</p>
  </footer>
  <script src="i18n/en.js"></script>
  <script src="i18n/rtl.js"></script>
  <script src="i18n/cjk.js"></script>
  <script src="i18n/indic.js"></script>
  <script src="i18n/iberian.js"></script>
  <script src="i18n/west.js"></script>
  <script src="i18n/east.js"></script>
  <script src="i18n2.js"></script>
  <script src="i18n3.js"></script>
  <script src="i18n.js"></script>
  <script src="site.js"></script>
</body>
</html>
